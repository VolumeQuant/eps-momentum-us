name: Unified US+KR Evening Signal

# 통합(US+KR) 저녁 신호 — 실매매 본선 (2026-07-10 사용자 결정: 회사PC schtask → GH Actions 이관)
# 장점: 회사PC 단일의존(bat pull 무음실패 취약점) 제거, 시크릿(GH) 그대로 사용,
#       US 채널 발송(아침 US 단독 메시지의 후속 상품) 일원화.
# KR 데이터: quant_py-main 레포 sparse checkout (KR DB + fs_dart parquet, ~30MB).
#   16:30 KST KR EPS 수집이 push한 최신본을 18:15 KST에 읽음.
# ⚠️ 필요 시크릿: KR_REPO_TOKEN(quant_py-main 읽기 PAT — 신규 등록 필요),
#   TELEGRAM_BOT_TOKEN/TELEGRAM_PRIVATE_ID/TELEGRAM_CHAT_ID(기존), GEMINI_API_KEY(기존),
#   ECOS_API_KEY(선택 — 없으면 수출 지표만 생략).
# ⚠️ 원장 단일 작성자: 이 워크플로우가 unified_vm_log.csv의 유일한 작성자.
#   첫 성공 후 회사PC schtask(run_unified_track.bat)는 삭제할 것 (이중 기록 방지).

on:
  # ★2026-07-31 재설계: KR 다리 제외(VM_US_ONLY) → 집PC 16:30 KR 수집을 기다릴 이유가 사라짐.
  #   구 구조는 그것 때문에 KST 18~20시(=UTC 08~11시)에 묶여 있었고, 그 구간이 GH 예약실행
  #   최다 드롭대라 크론을 3개나 걸어야 했다(2026-07-14 기록: 스케줄 2일 연속 미발동).
  #   → 미국 수집(daily-screening, UTC 22:05경 시작·22:12~22:50 종료 = 매일 정상)의
  #     '완료 이벤트'에 직접 연결. 시간 추측 없이 데이터 준비 완료 시점에 실행된다.
  #   ⚠️데이터 신선도는 동일하다(저녁 실행도 같은 날 아침 수집분을 읽었음) — 이득은 '예약 신뢰성'.
  #   conclusion 무관하게 실행: 수집 실패 시에도 직전 데이터로 발송(신호 결번 > 스테일 발송,
  #   run_daily._is_trading_day SPOF 수리와 동일 원칙). 스테일 여부는 메시지의 us_date로 식별.
  workflow_run:
    workflows: ["Daily EPS Momentum Screening"]
    types: [completed]
    branches: [master]
  schedule:
    # ★2026-07-31 사용자 지적: workflow_run만 쓰면 KST 화~토 발송이라 ①토요일 아침 신호는
    #   그날 밤 미국 정규장이 없어 2.5일 뒤(월요일 밤)에나 체결 ②정작 매매하는 월요일엔 알림이 없음.
    #   → 토요일(예고)과 월요일(매매 직전 재안내) 둘 다 발송. 월요일분은 금요일 마감 데이터를
    #     그대로 쓰므로 원장은 us_date 기준 1회만 반영(_replay 중복 처리)되고 지시만 반복된다.
    #   ⚠️백업 크론은 월~토 전체를 덮어야 한다 — workflow_run(화~토)이 드롭돼도 잡히도록.
    #     (2026-07-31 최초 작성 때 일요일 UTC만 넣어 화~금 백업이 사라졌던 것을 같은 날 수정)
    #     guard 스텝(당일 원장 블록 존재 시 스킵)이 중복 발송을 막으므로 겹쳐도 안전.
    - cron: '0 23 * * 0-5'   # UTC 일~금 23:00 = KST 월~토 08:00 (월=금요일분 재안내, 화~토=백업)
    - cron: '30 23 * * 0-5'  # KST 월~토 08:30 (2차 백업)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'UNIFIED_DRY_RUN=1 (발송 없이 로그만)'
        default: ''
      no_channel:
        description: '1이면 채널 발송 생략(개인봇만)'
        default: ''
      correction:
        description: '1이면 정정 발송(이미 발송된 지시 동결을 해제하고 정정 고지 포함)'
        default: ''

concurrency:
  group: yfinance-data-fetch   # 아침 수집 워크플로우와 yf rate-limit 직렬화
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  unified:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout US repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 당일 중복발송 차단: 스케줄 실행인데 오늘 원장블록이 이미 있으면(앞선 cron이 성공) 이하 전부 스킵.
      # concurrency로 직렬화되므로 뒤 cron은 앞 cron의 push된 원장을 체크아웃해 여기서 걸러짐.
      # 수동 dispatch는 guard 스텝 자체가 스킵(if=schedule) → skip 출력 공란 → 항상 실행.
      - name: Skip if already sent today (수동 dispatch 제외)
        id: guard
        if: github.event_name != 'workflow_dispatch'
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          if cut -d, -f1 data_cache/unified_vm_log.csv | grep -qx "$TODAY"; then
            echo "이미 오늘($TODAY) 발송됨 — 스킵"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "오늘($TODAY) 미발송 — 진행"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # VM_US_ONLY=1이면 KR 데이터는 읽지 않음 — 체크아웃 실패가 미국 신호를 죽이지 않도록 비차단.
      # (KR 복귀 시 그대로 되살아남)
      - name: Checkout KR data (quant_py-main, sparse)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: VolumeQuant/quant_py-main
          token: ${{ secrets.KR_REPO_TOKEN }}
          path: kr_repo
          sparse-checkout: |
            kr_eps_momentum/eps_momentum_data_kr.db
            data_cache/fs_dart_*.parquet
            state/regime_state.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unified signal
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: 'Asia/Seoul'
          KR_DB_PATH: ${{ github.workspace }}/kr_repo/kr_eps_momentum/eps_momentum_data_kr.db
          KR_FS_DIR: ${{ github.workspace }}/kr_repo/data_cache
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PRIVATE_ID: ${{ secrets.TELEGRAM_PRIVATE_ID }}
          # ★2026-08-06 사용자 지시: 채널 발송 전면 중단 — 개인봇에만 전송.
          #   UNIFIED_CHANNEL_ID 미설정 = unified_vm_track이 채널 경로를 아예 타지 않음
          #   (config.py 폴백은 GHA 러너엔 없음). 복원 = 아래 구 줄 복구.
          #   (구 줄, 2026-08-01 버그 수리분 — no_channel 유사삼항 반전:)
          # UNIFIED_CHANNEL_ID: ${{ github.event.inputs.no_channel != '1' && secrets.TELEGRAM_CHAT_ID || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          UNIFIED_DRY_RUN: ${{ github.event.inputs.dry_run }}
          # ★2026-07-31 전략 전환 (commit 737aed8 검증 근거):
          #   순위 기준 rev90(90일 전망 상향폭) → adj_gap(EPS 대비 가격 괴리율) + gap/min_seg 해제.
          #   같은 누적수익에 낙폭 절반(고점반납 −18.6%p→−0.6%p, MDD −27.1%→−16.2%),
          #   포트폴리오가 실제로 갈라진 6/16~ 구간은 수익도 우위(+9.4% vs −15.4%).
          #   교체주기(VM_REBAL)는 5일 유지 — R1/R2가 수치는 좋으나 신호감쇠(IC) 미확인 = 과적합 의심.
          #   롤백 = 아래 두 줄 삭제.
          VM_STRATEGY: gap
          VM_US_ONLY: '1'
          # 정정 발송 — 이미 나간 지시가 폐기된 규칙으로 만들어진 경우에만 수동 사용.
          VM_CORRECTION: ${{ github.event.inputs.correction }}
        run: |
          python unified_vm_track.py

      - name: Commit ledger
        if: ${{ github.event.inputs.dry_run != '1' && steps.guard.outputs.skip != 'true' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data_cache/unified_vm_log.csv
          if ! git diff --staged --quiet; then
            git commit -m "Unified signal ledger: $(date +%Y-%m-%d)"
            # --autostash: compute가 만든 부수 상태파일(unstaged)이 있어도 rebase 가능
            # (2026-07-23 원장 유실 사고 — rebase가 unstaged 변경으로 거부 → 커밋만 실패)
            git pull --rebase --autostash origin master
            git push
          else
            echo "원장 변경 없음"
          fi
