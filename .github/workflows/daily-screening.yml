name: Daily EPS Momentum Screening

on:
  # v119 (2026-06-11): cron 재개 — 제3방안(PE<15 저평가 보유) + Top5 진입 + high30 결정적 수정
  #   테스트워크플로우 검증 완료(BE+VRT 진입, 전송 정상, 에러 없음) 후 메인 채널 발송 활성화.
  schedule:
    - cron: '58 20 * * 1-5'  # 화~토 KST 05:58 = 월~금 UTC 20:58
  workflow_dispatch:  # 수동 실행도 가능

# v80.7 (2026-05-02): yfinance rate limit 회피 — 테스트 워크플로우와 동시 실행 시
# IP 기반 throttling으로 대량 수집 실패 발생 (5/2 사고: 333개 실패 → SNDK/VIRT 5/1
# 어닝 데이터 stale carry-forward → 매수 후보 오판). 같은 group으로 묶어 직렬화.
concurrency:
  group: yfinance-data-fetch
  cancel-in-progress: false  # 진행 중이면 큐에서 대기 (취소 X)

permissions:
  contents: write  # git push 권한

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  # ★2026-08-06 사용자 지시: 채널 발송 전면 중단 — TELEGRAM_CHAT_ID 제거(개인봇만).
  #   daily_runner는 os.environ.get이라 부재 시 채널 경로 스킵(안전). 복원 = 아래 줄 복구.
  # TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_PRIVATE_ID: ${{ secrets.TELEGRAM_PRIVATE_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

jobs:
  screening:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure git
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run EPS Momentum Screening
      run: |
        python daily_runner.py
      env:
        TZ: 'America/New_York'
        MESSAGE_VERSION: 'v3'  # v3 고정 (v2 제거됨)
        ENTRY_GAP_GATE: '1'    # gap게이트 ON, THR 2.5 (2026-06-28 그리드: 2.5~3.5 평지 robust·2.5는 분산우위). 끄기 '0'.
        ENTRY_GAP_THR: '2.5'
        US_MORNING_MSG_DISABLE: '1'  # US 아침 Signal/AI Risk 발송 중단 (2026-07-10 사용자 결정: 본선=저녁 18:10 통합 US+KR 신호 단일화). 수집·DB push·시스템 로그(개인봇)는 유지. 복원=이 줄 제거.

    # ★2026-08-01 발송 중단 (사용자 "꺼버려") — 관찰용 메시지 2종 정리.
    #   원칙: 안 따를 신호·행동으로 이어지지 않는 정보는 보여주지 않는다(메모리 감시등과 동일).
    #   ①기대성장 Sleeve: gap 사상의 구버전 페이퍼(-24.1%·MDD -34%) — 본선(괴리율)과 혼선 유발.
    #   ②TSEM 페이퍼 추적: 구 시스템(rev90+gap게이트) 전제의 관찰물 — 본선 전환으로 전제 소멸.
    #   로그 누적은 유지(--send만 제거, sleeve는 상태 갱신을 위해 무발송 실행).
    #   복원 = --send 되돌리기.
    - name: Run Forward-Growth Gap Sleeve (기록만, 발송 없음)
      run: |
        python gap_sleeve.py || echo "gap_sleeve 실패(무시, 메인 파이프라인 무관)"
      env:
        TZ: 'America/New_York'

    - name: Run blocked-candidate paper tracker (기록만, 발송 없음)
      run: |
        python research/paper_tracker_blocked.py || echo "paper_tracker 실패(무시, 매매 무관)"
      env:
        TZ: 'America/New_York'
        WATCH_TICKERS: 'TSEM'

    - name: Commit and push results
      run: |
        git add -A
        git diff --staged --quiet || git commit -m "Daily update: $(date -u +%Y-%m-%d)"
        git pull --no-rebase -X ours origin master || true
        git push
